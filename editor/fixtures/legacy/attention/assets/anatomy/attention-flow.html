<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>attention flow</title>
<style>html,body{margin:0;background:#fbf8f0}svg{display:block;width:100%;height:100%}.dot{animation:m 2s linear infinite}@keyframes m{to{transform:translateX(-120px)}}</style>
</head>
<body>
<svg viewBox="0 0 400 200" role="img" aria-label="مخطط بسيط لتدفق الانتباه">
  <rect x="20" y="70" width="80" height="60" rx="8" fill="#111f56"/>
  <rect x="300" y="70" width="80" height="60" rx="8" fill="#2747c9"/>
  <circle class="dot" cx="290" cy="100" r="6" fill="#ed3b2f"/>
</svg>
</body>
</html>
