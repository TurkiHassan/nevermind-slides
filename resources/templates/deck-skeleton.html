<!DOCTYPE html>
<html lang="{{LANG}}" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="nm-runtime" content="2">
<meta name="nm-stage" content="1920x1080">
<meta name="generator" content="nevermind-slides scaffold">
<title>{{TITLE}}</title>

{{TAILWIND}}<link rel="stylesheet" href="assets/nm/nm-deck.css">
<link rel="stylesheet" href="assets/nm/nm-layout.css">
<link rel="stylesheet" href="assets/nm/nm-focus.css">
<link rel="stylesheet" href="assets/nm/nm-diagram.css">
<link rel="stylesheet" href="assets/nm/nm-media.css">

<style>
    /* ==== 1. LOCAL FONTS (assets/fonts/; only the files stage-fonts found) ==== */
{{FONT_FACES}}

    /* ==== 2. THEME TOKENS (generated from deck.plan.json; edit the plan, not this block) ==== */
    :root {
{{THEME_VARS}}
      --nm-font-display: {{FONT_DISPLAY}};
      --nm-font-body: {{FONT_BODY}};
      --nm-font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
      /* legacy aliases */
      --lp-accent: var(--nm-accent);
      --slide-bg: var(--nm-paper);
      --stage-bg: var(--nm-paper);
      --lp-font-display: var(--nm-font-display);
      --lp-font-body: var(--nm-font-body);
      --lp-font-mono: var(--nm-font-mono);
    }

    /* Live font pairing classes on <body> */
{{FONT_MODE_CSS}}
    body[class*="font-mode-"] { --lp-font-display: var(--nm-font-display); --lp-font-body: var(--nm-font-body); }

    html, body { margin: 0; height: 100%; background: var(--nm-paper); color: var(--nm-ink); font-family: var(--nm-font-body); }

    /* ==== 3. SCAFFOLD PLACEHOLDERS (remove with the last data-nm-todo) ==== */
    .nm-ph { box-sizing: border-box; inline-size: 100%; block-size: 100%; min-block-size: 240px; display: grid; place-items: center; align-content: center; gap: 16px; margin: 0; border: 3px dashed var(--nm-line); border-radius: var(--nm-radius); background: var(--nm-surface); color: var(--nm-muted); font-size: 28px; text-align: center; }
    .nm-ph svg { inline-size: 96px; block-size: 96px; stroke: var(--nm-accent); fill: none; stroke-width: 3; }
    .nm-ph-label { font-size: 28px; color: var(--nm-muted); }
    .nm-ph-frame { block-size: 100%; }
</style>
</head>
<body dir="rtl" class="{{BODY_CLASS}}" data-nm-mode="{{MODE}}">
<script>
  window.NM_CONFIG = {
    fontModes: {{FONT_MODES_JSON}}
  };
</script>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
{{SLIDES}}
  </main>
</div>

<script src="assets/nm/nm-deck.js"></script>
<script src="assets/nm/nm-focus.js"></script>
<script src="assets/nm/nm-diagram.js"></script>
</body>
</html>
